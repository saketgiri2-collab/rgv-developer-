<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="#C5A059" stroke-width="6" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#092342" stroke-width="10" />

  <!-- Globe & Buildings -->
  <g transform="translate(0, -10)">
    <circle cx="250" cy="190" r="140" fill="none" stroke="#C5A059" stroke-width="2.5" opacity="0.85" />
    <ellipse cx="250" cy="190" rx="140" ry="55" fill="none" stroke="#C5A059" stroke-width="2" opacity="0.6" />
    <ellipse cx="250" cy="190" rx="80" ry="140" fill="none" stroke="#C5A059" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Skyscrapers -->
  <g>
    <!-- Left Building -->
    <path d="M 165 250 L 165 195 L 205 170 L 205 250 Z" fill="#092342" />
    <rect x="175" y="202" width="5" height="42" fill="#FFFFFF" />
    <rect x="186" y="194" width="5" height="50" fill="#FFFFFF" />
    <rect x="196" y="186" width="5" height="58" fill="#FFFFFF" />

    <!-- Center Building -->
    <path d="M 210 255 L 210 115 L 250 85 L 250 255 Z" fill="#092342" />
    <path d="M 250 85 L 285 110 L 285 255 L 250 255 Z" fill="#0E2E52" />
    <rect x="220" y="130" width="6" height="118" fill="#FFFFFF" />
    <rect x="233" y="118" width="6" height="130" fill="#FFFFFF" />
    <rect x="244" y="105" width="5" height="143" fill="#FFFFFF" />
    <rect x="256" y="122" width="6" height="126" fill="#FFFFFF" />
    <rect x="269" y="135" width="6" height="113" fill="#FFFFFF" />

    <!-- Right Building -->
    <path d="M 290 250 L 290 165 L 335 195 L 335 250 Z" fill="#092342" />
    <rect x="298" y="180" width="5" height="64" fill="#FFFFFF" />
    <rect x="309" y="189" width="5" height="55" fill="#FFFFFF" />
    <rect x="320" y="198" width="5" height="46" fill="#FFFFFF" />

    <!-- Horizon Swoosh -->
    <path d="M 75 272 Q 250 240 425 272 L 425 262 Q 250 230 75 262 Z" fill="#092342" />
  </g>

  <!-- Typography RGV -->
  <text 
    x="250" 
    y="370" 
    text-anchor="middle" 
    font-family="'Playfair Display', serif" 
    font-size="112" 
    font-weight="900" 
    fill="#092342" 
    letter-spacing="4"
  >RGV</text>

  <line x1="95" y1="390" x2="395" y2="390" stroke="#C5A059" stroke-width="2.5" />
  <polygon points="250,385 255,390 250,395 245,390" fill="#C5A059" />

  <text 
    x="250" 
    y="415" 
    text-anchor="middle" 
    font-family="sans-serif" 
    font-size="20" 
    font-weight="800" 
    fill="#092342" 
    letter-spacing="4.5"
  >SRI RAGHAVENDRA SWAMY</text>

  <text 
    x="250" 
    y="435" 
    text-anchor="middle" 
    font-family="sans-serif" 
    font-size="15" 
    font-weight="800" 
    fill="#092342" 
    letter-spacing="3.5"
  >DEVELOPERS PVT. LTD.</text>
</svg>
