<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEBA67" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9E782F" />
    </linearGradient>
    <!-- Navy Color: #092342 -->
  </defs>

  <!-- Background Clean White Circle -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- Outer Double Circular Borders -->
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#C5A059" stroke-width="4.5" />
  <!-- Inner Thick Navy Ring -->
  <circle cx="250" cy="250" r="224" fill="none" stroke="#092342" stroke-width="6.5" />

  <!-- GLOBE / CONTINENTS IN BACKGROUND -->
  <g id="globe-background" transform="translate(0, -10)">
    <!-- Globe Outer Ring -->
    <circle cx="250" cy="190" r="145" fill="none" stroke="#C5A059" stroke-width="1.8" opacity="0.85" />
    
    <!-- Globe Latitude / Longitude Ellipses -->
    <ellipse cx="250" cy="190" rx="145" ry="58" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.6" />
    <ellipse cx="250" cy="190" rx="85" ry="145" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.6" />
    <path d="M 108 190 Q 250 145 392 190" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.6" />
    <path d="M 125 135 Q 250 100 375 135" fill="none" stroke="#C5A059" stroke-width="1" opacity="0.5" />
    <path d="M 125 245 Q 250 280 375 245" fill="none" stroke="#C5A059" stroke-width="1" opacity="0.5" />

    <!-- Stylized Gold Continents Shapes -->
    <!-- North / Central America -->
    <path d="M 150 120 C 165 110, 185 115, 195 135 C 190 150, 175 160, 160 170 C 150 178, 142 165, 140 150 C 138 135, 142 125, 150 120 Z" fill="#C5A059" opacity="0.95" />
    <!-- South America -->
    <path d="M 175 185 C 195 190, 205 210, 198 235 C 190 250, 180 255, 172 245 C 165 230, 162 205, 175 185 Z" fill="#C5A059" opacity="0.95" />
    <!-- Europe & Asia (Eurasia) -->
    <path d="M 270 95 C 295 90, 335 100, 355 120 C 375 140, 370 165, 350 175 C 330 180, 310 160, 295 155 C 280 150, 265 125, 270 95 Z" fill="#C5A059" opacity="0.95" />
    <!-- Africa -->
    <path d="M 285 160 C 310 165, 325 185, 320 215 C 315 235, 295 245, 285 235 C 275 215, 275 180, 285 160 Z" fill="#C5A059" opacity="0.95" />
    <!-- Australia / Islands -->
    <ellipse cx="360" cy="225" rx="14" ry="9" fill="#C5A059" opacity="0.95" />
  </g>

  <!-- 3 NAVY SKYSCRAPERS / BUILDINGS -->
  <g id="skyscrapers">
    <!-- LEFT BUILDING -->
    <!-- Front Face -->
    <path d="M 165 250 L 165 195 L 205 170 L 205 250 Z" fill="#092342" />
    <!-- Window Slits -->
    <rect x="175" y="202" width="4.5" height="42" fill="#FFFFFF" />
    <rect x="186" y="194" width="4.5" height="50" fill="#FFFFFF" />
    <rect x="196" y="186" width="4.5" height="58" fill="#FFFFFF" />

    <!-- CENTER TALLEST BUILDING -->
    <!-- Front / Left Face -->
    <path d="M 210 255 L 210 115 L 250 85 L 250 255 Z" fill="#092342" />
    <!-- Side / Right Face (Angled Roof) -->
    <path d="M 250 85 L 285 110 L 285 255 L 250 255 Z" fill="#0E2E52" />
    <!-- Center Windows -->
    <rect x="220" y="130" width="5.5" height="118" fill="#FFFFFF" />
    <rect x="233" y="118" width="5.5" height="130" fill="#FFFFFF" />
    <rect x="244" y="105" width="4" height="143" fill="#FFFFFF" />
    <rect x="256" y="122" width="5.5" height="126" fill="#FFFFFF" />
    <rect x="269" y="135" width="5.5" height="113" fill="#FFFFFF" />

    <!-- RIGHT BUILDING -->
    <!-- Front Face -->
    <path d="M 290 250 L 290 165 L 335 195 L 335 250 Z" fill="#092342" />
    <!-- Window Slits -->
    <rect x="298" y="180" width="4.5" height="64" fill="#FFFFFF" />
    <rect x="309" y="189" width="4.5" height="55" fill="#FFFFFF" />
    <rect x="320" y="198" width="4.5" height="46" fill="#FFFFFF" />

    <!-- Horizon Swoosh Arched Curve Underneath Buildings -->
    <path d="M 75 272 Q 250 240 425 272 L 425 264 Q 250 232 75 264 Z" fill="#092342" />
  </g>

  <!-- RGV TYPOGRAPHY -->
  <g id="brand-typography">
    <!-- "RGV" Large Bold Serif Text -->
    <text 
      x="250" 
      y="368" 
      text-anchor="middle" 
      font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif" 
      font-size="108" 
      font-weight="900" 
      fill="#092342" 
      letter-spacing="4"
    >RGV</text>

    <!-- Thin Gold Separator Line with Centered Diamond Accent -->
    <line x1="95" y1="388" x2="395" y2="388" stroke="#C5A059" stroke-width="1.8" />
    <polygon points="250,384 254,388 250,392 246,388" fill="#C5A059" />

    <!-- "SRI RAGHAVENDRA SWAMY" Subtitle -->
    <text 
      x="250" 
      y="412" 
      text-anchor="middle" 
      font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" 
      font-size="19" 
      font-weight="700" 
      fill="#092342" 
      letter-spacing="4.5"
    >SRI RAGHAVENDRA SWAMY</text>

    <!-- "DEVELOPERS PVT. LTD." with Gold Diamonds -->
    <g transform="translate(0, 432)">
      <!-- Left Gold Diamond Accent -->
      <polygon points="125,-4 140,-4 145,-4 135,-4" stroke="#C5A059" stroke-width="1.5" />
      <path d="M 125,-4 L 145,-4" stroke="#C5A059" stroke-width="1.5" />
      <polygon points="152,-7 157,-4 152,-1 147,-4" fill="#C5A059" />
      
      <!-- Text -->
      <text 
        x="250" 
        y="0" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" 
        font-size="14.5" 
        font-weight="700" 
        fill="#092342" 
        letter-spacing="3.5"
      >DEVELOPERS PVT. LTD.</text>

      <!-- Right Gold Diamond Accent -->
      <polygon points="348,-7 353,-4 348,-1 343,-4" fill="#C5A059" />
      <path d="M 355,-4 L 375,-4" stroke="#C5A059" stroke-width="1.5" />
    </g>
  </g>
</svg>
